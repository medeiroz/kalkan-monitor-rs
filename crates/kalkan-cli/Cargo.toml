[package]
name = "kalkan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line utility for Kalkan Alpha 240 / 360 / 360-W and Delta V2 240 / 360 watercoolers (SmartMonitor 1.3; Alpha Rev.1 / SmartMonitor 1.2 experimental): list devices, read sensors, test the display"
repository = "https://github.com/medeiroz/kalkan-monitor-rs"
keywords = ["kalkan", "delta-v2", "alpha", "watercooler", "cli"]
categories = ["hardware-support", "command-line-utilities"]

[[bin]]
name = "kalkan"
path = "src/main.rs"

[dependencies]
kalkan-core = { path = "../kalkan-core" }
anyhow.workspace = true
sysinfo.workspace = true
