[package]
name = "kalkan-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Monitor for Kalkan Alpha 240 / 360 / 360-W and Delta V2 240 / 360 AIO watercoolers: sends the CPU temperature to the cooler display (Kalkan SmartMonitor 1.3; Alpha Rev.1 / SmartMonitor 1.2 experimental)"
repository = "https://github.com/medeiroz/kalkan-monitor-rs"
keywords = ["kalkan", "delta-v2", "alpha", "watercooler", "smartmonitor"]
categories = ["hardware-support"]

[[bin]]
name = "kalkan-monitor"
path = "src/main.rs"

[dependencies]
kalkan-core = { path = "../kalkan-core" }
# Only the winit backend (X11 + Wayland on Linux) with the software renderer:
# no OpenGL/femtovg stack, no accesskit, no Slint system tray (the app uses
# `tray-icon`). Keeps the resident memory of the tray app low.
slint = { version = "1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
anyhow.workspace = true
dirs.workspace = true

[build-dependencies]
slint-build = "1.18.1"

# Embeds the app icon in the Windows .exe (Explorer, taskbar, shortcuts).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# System tray. Windows/macOS use the native one. Linux publishes a
# StatusNotifierItem over D-Bus (`ksni` backend), which needs no GTK or
# appindicator system libraries; `zbus` is used to detect whether the desktop
# has a StatusNotifier host at all (stock GNOME does not).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Debian package: `cargo deb -p kalkan-ui` (see .github/workflows/release.yml).
[package.metadata.deb]
name = "kalkan-monitor"
maintainer = "Kalkan Monitor RS contributors <noreply@users.noreply.github.com>"
copyright = "2026, Kalkan Monitor RS contributors"
section = "utils"
priority = "optional"
depends = "$auto"
extended-description = """\
Sends the CPU temperature to the display of Kalkan Alpha 240, Alpha 360 and \
Alpha 360-W (round LCD, temperature only) and Delta V2 240 and Delta V2 360 \
AIO watercoolers (Kalkan SmartMonitor 1.3 protocol) over the cooler's USB \
serial port. Delta V2 is compatible by protocol but not yet tested on hardware. \
Older Alpha Rev.1 units (sold before Jan/2026, SmartMonitor 1.2 over USB HID) \
are supported experimentally, not yet tested on hardware. Sensors come from \
the kernel hwmon interface. A udev rule grants the logged-in user access to \
the display (serial port or hidraw node)."""
maintainer-scripts = "../../linux/debian"
assets = [
    ["target/release/kalkan-monitor", "usr/bin/", "755"],
    ["../../linux/kalkan-monitor.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/kalkan-monitor.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["../../assets/icons/kalkan-monitor.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../linux/udev/60-kalkan-monitor.rules", "usr/lib/udev/rules.d/", "644"],
]
