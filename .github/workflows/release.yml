name: Release

# Tag `v*` (e.g. v0.1.0): builds the installer and publishes a GitHub Release.
# A manual run (workflow_dispatch) only produces the installer as an artifact.
# The tag trigger is disabled for now; manual runs only.
on:
  # push:
  #   tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          ./windows/installer/build.ps1 -Version $v

      # archive: false uploads the .exe as-is (downloads as the .exe, not a zip).
      - uses: actions/upload-artifact@v7
        with:
          path: target/installer/KalkanMonitor-Setup-*.exe
          archive: false

      - uses: softprops/action-gh-release@v3
        if: github.ref_type == 'tag'
        with:
          files: target/installer/KalkanMonitor-Setup-*.exe
          generate_release_notes: true
