name: Release

# Builds the Windows installer, the Linux .deb and the macOS .dmg, then publishes a GitHub Release.
# - Push to main: when all three builds succeed, the `publish` job creates the tag
#   v<MAJOR.MINOR>.<run number> (MAJOR.MINOR from the version in Cargo.toml) and the Release.
#   The tag is created by the workflow itself, with GITHUB_TOKEN: never push tags by hand.
# - Tag `v*` pushed manually: builds with the tag's version and publishes that Release.
# - Manual run (workflow_dispatch): artifacts only, no Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# A newer push to main cancels the in-progress build (a cancelled run never publishes, because
# `publish` needs all three builds to succeed). Tag builds are never cancelled.
concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Single source of truth for the version: the installer, .deb, .dmg and the tag all use it.
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/^version[[:space:]]*=[[:space:]]*"([0-9]+)\.([0-9]+)\..*$/\1.\2/')
            if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then echo "could not read MAJOR.MINOR from Cargo.toml (got '$base')" >&2; exit 1; fi
            version="$base.$GITHUB_RUN_NUMBER"
          fi
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]]; then echo "invalid version '$version'" >&2; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version $version (tag v$version)"

  windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build the installer
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          ./windows/installer/build.ps1 -Version $v

      # archive: false uploads the .exe as-is (downloads as the .exe, not a zip).
      - uses: actions/upload-artifact@v7
        with:
          path: target/installer/KalkanMonitor-Setup-*.exe
          archive: false

  linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Linux dependencies (serial + Slint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libfontconfig1-dev libxkbcommon-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # Packaging is configured in [package.metadata.deb] of crates/kalkan-ui/Cargo.toml.
      - name: Build the .deb
        run: |
          v="${{ needs.version.outputs.version }}"
          cargo deb -p kalkan-ui --deb-version "$v"

      # archive: false uploads the .deb as-is (downloads as the .deb, not a zip).
      - uses: actions/upload-artifact@v7
        with:
          path: target/debian/kalkan-monitor_*.deb
          archive: false

  macos:
    name: Mac
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Universal binary (Apple Silicon + Intel), Kalkan Monitor.app with its
      # Info.plist and .icns, ad-hoc signature and the .dmg: see macos/build.sh.
      - name: Build the .app and the .dmg
        run: |
          v="${{ needs.version.outputs.version }}"
          bash macos/build.sh "$v"

      # archive: false uploads the .dmg as-is (downloads as the .dmg, not a zip).
      - uses: actions/upload-artifact@v7
        with:
          path: target/macos/KalkanMonitor-*.dmg
          archive: false

  # Only runs when all three builds succeeded (default `needs` behaviour), so a Release is never
  # half-published. Re-running a failed run reuses the same tag: the action updates the Release.
  publish:
    name: Publish release
    needs: [version, windows, linux, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Artifacts were uploaded with `archive: false` (named after the file); download-artifact@v8
      # fetches them as-is, merged into ./dist.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - run: ls -l dist

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kalkan Monitor ${{ needs.version.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/KalkanMonitor-Setup-*.exe
            dist/kalkan-monitor_*.deb
            dist/KalkanMonitor-*.dmg
          body: |
            ## Downloads

            - **Windows**: `KalkanMonitor-Setup-${{ needs.version.outputs.version }}.exe` (installer)
            - **Linux**: `kalkan-monitor_${{ needs.version.outputs.version }}_amd64.deb`
            - **macOS**: `KalkanMonitor-${{ needs.version.outputs.version }}.dmg` (Apple Silicon and Intel)

            Supports Kalkan Alpha Rev.2 (from Jan/2026) and Delta V2.

            ## Changes
