name: CI

# Gatilhos automáticos desativados por enquanto; só roda manualmente.
on:
  # push:
  #   branches: [main]
  # pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dependências do Linux (serial/HID + Slint)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev libfontconfig1-dev libxkbcommon-dev

      - run: cargo test --workspace
